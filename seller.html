<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login Please buy some food</title>
    <style>
        :root {
            --primary-color: #1c11ed;
            --secondary-color: #d3d8d3;
            --accent-color: #ef0000;
            --light-gray: #f5f5f5;
            --dark-gray: #333;
            --white: #ffffff;
            --box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f9f9f9;
            color: var(--dark-gray);
        }
        
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--box-shadow);
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        #seller-dashboard {
            background-color: var(--white);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--box-shadow);
        }
        
        #logout-btn {
            background-color: var(--accent-color);
            color: var(--white);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            float: right;
            transition: all 0.3s ease;
        }
        
        #logout-btn:hover {
            background-color: #e68a00;
            transform: translateY(-2px);
        }
        
        h3 {
            color: var(--primary-color);
            margin: 1.5rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--light-gray);
        }
        
        input[type="text"] {
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
            margin-right: 0.5rem;
            font-size: 1rem;
        }
        
        button:not(#logout-btn) {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        button:not(#logout-btn):hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        #check-result {
            margin-top: 1rem;
            padding: 0.8rem;
            background-color: var(--light-gray);
            border-radius: 4px;
            display: inline-block;
            min-width: 300px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            box-shadow: var(--box-shadow);
        }
        
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: var(--primary-color);
            color: var(--white);
        }
        
        tr:nth-child(even) {
            background-color: var(--light-gray);
        }
        
        tr:hover {
            background-color: #e8f5e9;
        }
        
        #order-total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 1rem;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            input[type="text"] {
                width: 100%;
                margin-bottom: 0.5rem;
            }
            
            button {
                width: 100%;
                margin-bottom: 1rem;
            }
            
            #logout-btn {
                float: none;
                display: block;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Fruit Market Come and Buy Some Food</h1>
    </header>
    <main>
        <section id="seller-dashboard">
            <button id="logout-btn">Logout</button>

            <!-- Check Fruit Availability -->
            <div class="dashboard-section">
                <h3>Check Fruit Availability</h3>
                <input type="text" id="check-fruit" placeholder="Enter fruit name">
                <button id="check-btn">Check</button>
                <p id="check-result">Enter a fruit name to check availability and price</p>
            </div>

            <!-- Create Order -->
            <div class="dashboard-section">
                <h3>Create Order</h3>
                <form id="order-form">
                    <table>
                        <thead>
                            <tr>
                                <th>Fruit</th>
                                <th>Price ($/kg)</th>
                                <th>Quantity (kg)</th>
                            </tr>
                        </thead>
                        <tbody id="order-table-body">
                            <!-- Sample rows - these would be populated dynamically -->
                            <tr>
                                <td>Apple</td>
                                <td>$2.50</td>
                                <td><input type="number" min="0" step="0.1" value="0"></td>
                            </tr>
                            <tr>
                                <td>Banana</td>
                                <td>$1.50</td>
                                <td><input type="number" min="0" step="0.1" value="0"></td>
                            </tr>
                            <tr>
                                <td>Orange</td>
                                <td>$3.00</td>
                                <td><input type="number" min="0" step="0.1" value="0"></td>
                            </tr>
                            <tr>
                                <td>Mango</td>
                                <td>$4.50</td>
                                <td><input type="number" min="0" step="0.1" value="0"></td>
                            </tr>
                        </tbody>
                    </table>
                    <button type="submit">Calculate Total</button>
                </form>
                <p id="order-total">Total: $0.00</p>
            </div>
        </section>
    </main>
    <script src="seller.js"></script>
</body>
</html>
